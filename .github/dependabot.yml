# Three direct dependencies in the whole workspace (memmap2, rayon, and the
# path crates), so the noise floor here is near zero -- which is the only
# reason this is worth having switched on.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
