# Build every distributable artifact on a v* tag and attach them to the
# GitHub Release.
#
# THE ASYMMETRY IS THE POINT, and it is stated rather than buried:
#
#   Linux .deb        built, INSTALLED with dpkg -i, and the installed binary run
#   Linux binary      built and run
#   macOS binary      built and run (and the full suite runs on macos-latest in ci.yml)
#   Windows .exe      built NATIVELY on a Windows runner, and run
#
# The Windows job used to cross-compile x86_64-pc-windows-gnu with mingw on
# Ubuntu and never execute the result -- which meant the shipped .exe was a
# different binary, from a different toolchain, than the one CI tested. Since
# 2026-08-27 the test matrix includes windows-latest, so the release binary is
# built on the same platform that runs the suite and is executed before upload.
# See packaging/README.md.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: psolve-linux-amd64
          - os: macos-latest
            asset: psolve-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release

      # A release binary that has never run is not a release binary.
      - name: the binary runs
        run: ./target/release/psolve --version

      - run: mv target/release/psolve "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Asserted rather than assumed: a silently-wrong architecture installs
      # and then fails at exec time.
      - name: runner is amd64
        run: |
          arch=$(dpkg --print-architecture)
          echo "dpkg architecture: $arch"
          test "$arch" = "amd64"

      - run: cargo install cargo-deb --locked --version '^2'
      - run: cargo build --release -p psolve-cli
      - run: ./target/release/psolve --version
      - name: build the package
        run: cargo deb -p psolve-cli --no-build --output "psolve_${GITHUB_REF_NAME}_amd64.deb"

      # Prove the package is installable and that the binary inside it actually
      # runs, rather than shipping a .deb only dpkg-deb has ever opened. This is
      # the strongest verification in the project.
      - name: install it and run what was installed
        run: |
          sudo dpkg -i ./psolve_${GITHUB_REF_NAME}_amd64.deb
          psolve --version
          dpkg -L psolve

      - uses: actions/upload-artifact@v7
        with:
          name: psolve-deb
          path: psolve_*_amd64.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release

      # The whole point of moving this off a cross-compile: the artifact that
      # ships is the one that ran.
      - name: the binary runs
        run: ./target/release/psolve.exe --version

      - name: stage the zip
        shell: bash
        run: |
          stage="psolve-${GITHUB_REF_NAME}-x86_64-windows"
          mkdir -p "$stage"
          cp target/release/psolve.exe "$stage/"
          cp README.md LICENSE docs/astap-compat.md docs/index-building.md docs/data-licence.md "$stage/"
          7z a "${stage}.zip" "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: psolve-windows
          path: psolve-*-x86_64-windows.zip

  publish:
    needs: [binaries, deb, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body: |
            See CHANGELOG.md for what is in this release, including its known limits.

            **psolve needs a star index.** A prebuilt all-sky G<=14 pair may be
            attached to this release (`.psidx`, plus `.psqidx` for blind
            solving) -- check the asset list. Otherwise build one from a Gaia
            DR3 mirror with `psolve index build`; docs/index-building.md's
            "Which depth do you need" answers which depth from your field of
            view.

            **Any index file here is NOT MIT.** Derived from Gaia DR3, it is
            CC BY-NC 3.0 IGO -- non-commercial, attribution required. See
            INDEX-LICENCE.txt and docs/data-licence.md. The MIT licence covers
            the binaries, not the data.

            **What was verified, and what was not:**

            - `.deb` -- built, installed with `dpkg -i`, and the installed
              binary executed by CI.
            - Linux and macOS binaries -- built and executed by CI. The full
              test suite also runs on both platforms on every push.
            - Windows `.exe` -- built natively on a Windows runner and
              executed by CI, which also runs 620 of the 634 tests there (the
              14 skipped are Unix-only symlink and permission cases). **No
              human has used psolve on Windows**, though: the author does not
              run Windows, and every real frame this project has solved was
              solved on macOS. It also has a weaker `-update` safety model
              than Unix: one of the three `.psolve-readonly` ancestor chains is
              unavailable there.

            The macOS binary is unsigned and unnotarised; Gatekeeper will
            quarantine it.
