    url: https://github.com/astroops-cloud/psolve/security/advisories/new
    about: >
      Report privately instead of opening an issue. psolve parses untrusted
      FITS by design -- see SECURITY.md for what is in scope.
  - name: Building an index
    url: https://github.com/astroops-cloud/psolve/blob/main/docs/index-building.md
